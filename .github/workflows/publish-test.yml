name: Publish approved 0.1.5 test release
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish exact reviewed CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=Malti2/HomeEar
          RUN=37603133707
          SHA=1f54e144534a12ee1fea4bbe63e9c7c6585e64ea
          test "$(gh api repos/$REPO/actions/runs/$RUN --jq .conclusion)" = success
          test "$(gh api repos/$REPO/actions/runs/$RUN --jq .head_sha)" = "$SHA"
          gh run download "$RUN" --repo "$REPO" --name HomeEar-development --dir dist
          test -s dist/HomeEar.dmg
          test -s dist/HomeEar.zip
          test -s dist/updates/HomeEar-0.1.5.zip
          test -s dist/updates/appcast.xml
          sha256sum --check dist/SHA256SUMS.txt
          test "$(gh release view v0.1.5 --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = true
          test "$(gh api repos/$REPO/git/ref/tags/v0.1.5 --jq .object.sha)" = "$SHA"
          test "$(gh release view v0.1.5 --repo "$REPO" --json assets --jq '.assets | length')" = 0
          gh release upload v0.1.5 --repo "$REPO" dist/HomeEar.dmg dist/HomeEar.zip dist/updates/HomeEar-0.1.5.zip dist/updates/appcast.xml dist/SHA256SUMS.txt dist/gatekeeper-assessment.txt
