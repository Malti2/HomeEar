name: Publish approved 0.1.4 test release
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish exact reviewed CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=Malti2/HomeEar
          RUN=37592429697
          SHA=7dff10f94fae5cca72cf4095057f29a7c7e4dec7
          test "$(gh api repos/$REPO/actions/runs/$RUN --jq .conclusion)" = success
          test "$(gh api repos/$REPO/actions/runs/$RUN --jq .head_sha)" = "$SHA"
          gh run download "$RUN" --repo "$REPO" --name HomeEar-development --dir dist
          test -s dist/HomeEar.dmg
          test -s dist/HomeEar.zip
          test -s dist/updates/HomeEar-0.1.4.zip
          test -s dist/updates/appcast.xml
          sha256sum --check dist/SHA256SUMS.txt
          if gh release view v0.1.4 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Release already exists; no overwrite.'
            exit 1
          fi
          cat > notes.md <<'NOTES'
          HomeEar 0.1.4 test release for Apple Silicon, macOS 26 or newer.

          - Drag-to-Applications DMG and ZIP; ad-hoc bundle integrity sealing.
          - Update section in existing Settings, using Sparkle 2.10.0 and signed update feed/archive validation.
          - Poke and direct Home Assistant Assist remain selectable.
          - CI: 30 tests passed, package integrity and generated update signatures verified.

          This is NOT Developer ID signed or notarized. macOS may require an explicit Open Anyway confirmation in Privacy & Security. Exact downloaded-build Gatekeeper behavior remains untested; no quarantine-removal commands are provided.

          First install is manual. End-to-end download/install/relaunch between versions is not yet tested. This prerelease is intentionally excluded from GitHub's stable latest-release feed, so automatic stable updates will not offer it. The signed appcast is included for review and future update testing.

          No live Home Assistant control or microphone-latency result is claimed. This release does not include a newly selected full UI redesign.
          NOTES
          gh release create v0.1.4 --repo "$REPO" --target "$SHA" --prerelease --title 'HomeEar 0.1.4 - Test Release' --notes-file notes.md dist/HomeEar.dmg dist/HomeEar.zip dist/updates/HomeEar-0.1.4.zip dist/updates/appcast.xml dist/SHA256SUMS.txt dist/gatekeeper-assessment.txt
