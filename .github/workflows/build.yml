name: Build HomeEar
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bundle pinned Poke runtime
        run: |
          mkdir -p HomeEar/Runtime
          curl -fL --retry 3 https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-arm64.tar.gz -o node.tar.gz
          echo '23b25245dcfb9af7262f8ff142e9e2e0af025368117329e7a7458a51e5922f53  node.tar.gz' | shasum -a 256 -c -
          tar -xOf node.tar.gz node-v22.23.3-darwin-arm64/bin/node > HomeEar/Runtime/node
          chmod 755 HomeEar/Runtime/node
          curl -fL --retry 3 https://registry.npmjs.org/poke/-/poke-4.0.461.tgz -o poke.tgz
          echo 'wQu6NzjOZamS9jmbmZX60BQtGEXgBeU66dwK2cp/xyERdLWaxc+9VXcWfrjH8zvcw/Z1fColWKPSQyBANawPsg==' | openssl base64 -d -A | od -An -tx1 | tr -d ' \n' > expected-sha512
          openssl dgst -sha512 -binary poke.tgz | od -An -tx1 | tr -d ' \n' > actual-sha512
          diff expected-sha512 actual-sha512
          tar -xOf poke.tgz package/dist/cli.cjs > HomeEar/Runtime/poke.cjs
          cp Node-LICENSE.txt HomeEar/Runtime/Node-LICENSE.txt
          cp LICENSE-THIRD-PARTY.md HomeEar/Runtime/LICENSE-THIRD-PARTY.md
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project HomeEar.xcodeproj -scheme HomeEarTests -destination 'platform=macOS' ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | tail -30
          grep -E 'Executed .* tests' test.log | tail -5
          grep -q 'TEST SUCCEEDED' test.log
      - name: Build unsigned development app
        run: |
          set -o pipefail
          xcodebuild -project HomeEar.xcodeproj -scheme HomeEar -configuration Release -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)|^\*\*|The following build commands failed' | tail -100
      - name: Seal app bundle for integrity (ad-hoc, not Developer ID)
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/HomeEar.app' -print -quit)
          test -n "$APP"
          # Re-seal the embedded Node executable and the final bundle after all copies.
          # Keep Sparkle's upstream helper signatures intact. No quarantine removal.
          codesign --force --sign - --identifier net.homeear.runtime.node "$APP/Contents/Resources/Runtime/node"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/Runtime/node"
          codesign --verify --deep --strict --verbose=2 "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --sign - --identifier net.homeear.HomeEar "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
      - name: Package development artifact
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/HomeEar.app' -print -quit)
          test -n "$APP"
          test -x "$APP/Contents/MacOS/HomeEar"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/Runtime/node"
          test -s "$APP/Contents/Resources/Runtime/poke.cjs"
          "$APP/Contents/Resources/Runtime/node" --version
          "$APP/Contents/Resources/Runtime/node" "$APP/Contents/Resources/Runtime/poke.cjs" --version
          find "$APP/Contents/Resources/Runtime" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || ls -la "$APP/Contents/Resources/Runtime"
          mkdir -p dist/dmg-root
          ditto "$APP" dist/dmg-root/HomeEar.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname HomeEar -srcfolder dist/dmg-root -ov -format UDZO dist/HomeEar.dmg
          hdiutil verify dist/HomeEar.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/HomeEar.zip
          mkdir -p dist/zip-check
          ditto -x -k dist/HomeEar.zip dist/zip-check
          codesign --verify --deep --strict --verbose=2 dist/zip-check/HomeEar.app
          test -x dist/zip-check/HomeEar.app/Contents/Resources/Runtime/node
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/dist/mounted-dmg" dist/HomeEar.dmg
          codesign --verify --deep --strict --verbose=2 dist/mounted-dmg/HomeEar.app
          test -L dist/mounted-dmg/Applications
          hdiutil detach "$PWD/dist/mounted-dmg"
          shasum -a 256 dist/HomeEar.zip dist/HomeEar.dmg > dist/SHA256SUMS.txt
          # Developer ID is intentionally unavailable in this development build.
          # Gatekeeper assessment is diagnostic, not suppressed or treated as notarization.
          spctl --assess --type execute --verbose=4 "$APP" > dist/gatekeeper-assessment.txt 2>&1 || true
          cat dist/gatekeeper-assessment.txt
      - name: Prepare signed update feed (no release publication)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          TOOLS=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)
          test -x "$TOOLS"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/zip-check/HomeEar.app/Contents/Info.plist)
          mkdir -p dist/updates
          cp dist/HomeEar.zip "dist/updates/HomeEar-$VERSION.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS" --ed-key-file - --download-url-prefix "https://github.com/Malti2/HomeEar/releases/download/v$VERSION/" dist/updates
          test -s dist/updates/appcast.xml
          grep -q edSignature dist/updates/appcast.xml
          SIGN_TOOL="$(dirname "$TOOLS")/sign_update"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - --verify dist/updates/appcast.xml
          SIG=$(python3 -c 'import xml.etree.ElementTree as E; r=E.parse("dist/updates/appcast.xml"); print(r.find(".//enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - --verify "dist/updates/HomeEar-$VERSION.zip" "$SIG"
          # Verify the exact feed URL embedded in this app, not just a local file.
          FEED=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' dist/zip-check/HomeEar.app/Contents/Info.plist)
          curl --fail --location --proto '=https' --proto-redir '=https' "$FEED" -o dist/updates/live-test-appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - --verify dist/updates/live-test-appcast.xml
          rm dist/updates/live-test-appcast.xml
          # Never edit the feed after signing it.
      - name: Capture development windows on runner
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/HomeEar.app' -print -quit)
          mkdir -p ui-capture
          "$APP/Contents/MacOS/HomeEar" --capture-ui "$PWD/ui-capture" > ui-capture.log 2>&1 &
          PID=$!
          for ATTEMPT in $(seq 1 45); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            echo 'UI capture timed out'
            cat ui-capture.log
            exit 1
          fi
          wait "$PID"
          cat ui-capture.log
          grep -q HOME_EAR_UI_CAPTURE_SUCCEEDED ui-capture.log
          for NAME in panel settings settings-lower onboarding setup-step-2 setup-step-3 setup-step-4 panel-assist setup-assist settings-beta settings-beta-lower; do
            test -s "ui-capture/HomeEar-$NAME.png"
            sips -g pixelWidth -g pixelHeight "ui-capture/HomeEar-$NAME.png"
            echo "SCREENSHOT_${NAME}_BASE64_BEGIN"
            base64 < "ui-capture/HomeEar-$NAME.png" | tr -d '\n'
            echo
            echo "SCREENSHOT_${NAME}_BASE64_END"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: HomeEar-window-screenshots
          path: ui-capture/*.png
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: HomeEar-development
          path: |
            dist/HomeEar.zip
            dist/HomeEar.dmg
            dist/SHA256SUMS.txt
            dist/gatekeeper-assessment.txt
            dist/updates/*.zip
            dist/updates/appcast.xml
          retention-days: 3
