name: Build HomeEar
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bundle pinned Poke runtime
        run: |
          mkdir -p HomeEar/Runtime
          curl -fL --retry 3 https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-arm64.tar.gz -o node.tar.gz
          echo '23b25245dcfb9af7262f8ff142e9e2e0af025368117329e7a7458a51e5922f53  node.tar.gz' | shasum -a 256 -c -
          tar -xOf node.tar.gz node-v22.23.3-darwin-arm64/bin/node > HomeEar/Runtime/node
          chmod 755 HomeEar/Runtime/node
          curl -fL --retry 3 https://registry.npmjs.org/poke/-/poke-4.0.461.tgz -o poke.tgz
          echo 'wQu6NzjOZamS9jmbmZX60BQtGEXgBeU66dwK2cp/xyERdLWaxc+9VXcWfrjH8zvcw/Z1fColWKPSQyBANawPsg==' | openssl base64 -d -A | od -An -tx1 | tr -d ' \n' > expected-sha512
          openssl dgst -sha512 -binary poke.tgz | od -An -tx1 | tr -d ' \n' > actual-sha512
          diff expected-sha512 actual-sha512
          tar -xOf poke.tgz package/dist/cli.cjs > HomeEar/Runtime/poke.cjs
          cp Node-LICENSE.txt HomeEar/Runtime/Node-LICENSE.txt
          cp LICENSE-THIRD-PARTY.md HomeEar/Runtime/LICENSE-THIRD-PARTY.md
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project HomeEar.xcodeproj -scheme HomeEarTests -destination 'platform=macOS' -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | tail -30
          grep -E 'Executed .* tests' test.log | tail -5
          grep -q 'BUILD SUCCEEDED' test.log
      - name: Build unsigned development app
        run: |
          set -o pipefail
          xcodebuild -project HomeEar.xcodeproj -scheme HomeEar -configuration Release -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)|^\*\*|The following build commands failed' | tail -100
      - name: Package development artifact
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/HomeEar.app' -print -quit)
          test -n "$APP"
          test -x "$APP/Contents/MacOS/HomeEar"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Resources/Runtime/node"
          test -s "$APP/Contents/Resources/Runtime/poke.cjs"
          "$APP/Contents/Resources/Runtime/node" --version
          "$APP/Contents/Resources/Runtime/node" "$APP/Contents/Resources/Runtime/poke.cjs" --version
          find "$APP/Contents/Resources/Runtime" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || ls -la "$APP/Contents/Resources/Runtime"
          ditto -c -k --keepParent "$APP" HomeEar-dev.zip
      - name: Capture development UI on runner
        continue-on-error: true
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release/HomeEar.app' -print -quit)
          open "$APP"
          sleep 5
          osascript -e 'tell application "HomeEar" to activate' || true
          screencapture -x HomeEar-runner-desktop.png
          sips -g pixelWidth -g pixelHeight HomeEar-runner-desktop.png
          echo SCREENSHOT_BASE64_BEGIN
          base64 < HomeEar-runner-desktop.png | tr -d '\n'
          echo
          echo SCREENSHOT_BASE64_END
      - uses: actions/upload-artifact@v4
        with:
          name: HomeEar-runner-screenshot
          path: HomeEar-runner-desktop.png
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: HomeEar-development
          path: HomeEar-dev.zip
          retention-day
