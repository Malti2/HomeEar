name: HomeEar
options:
  bundleIdPrefix: net.homeear
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  HomeEar:
    type: application
    platform: macOS
    sources:
      - path: HomeEar
        excludes:
          - Runtime
      - path: HomeEar/Runtime
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.homeear.HomeEar
        PRODUCT_NAME: HomeEar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HomeEar/Info.plist
        CODE_SIGN_ENTITLEMENTS: HomeEar/HomeEar.entitlements
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
