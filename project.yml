name: HomeEar
options:
  bundleIdPrefix: net.homeear
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGNING_ALLOWED: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  HomeEar:
    type: application
    platform: macOS
    sources:
      - path: HomeEar
        excludes:
          - Runtime
      - path: HomeEar/Runtime
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.homeear.HomeEar
        PRODUCT_NAME: HomeEar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HomeEar/Info.plist
        CODE_SIGN_ENTITLEMENTS: HomeEar/HomeEar.entitlements
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Sparkle
    scheme:
      testTargets: []
  HomeEarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HomeEarTests
    dependencies:
      - target: HomeEar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.homeear.HomeEarTests
